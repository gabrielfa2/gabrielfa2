name: Update contribution calendar

on:
  # Scheduled/manual only: a push trigger would race with local pushes because
  # this workflow commits the regenerated SVGs back to main.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-calendar
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate calendars
        run: node scripts/generate-contribution-calendar.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-calendar.svg contrib-calendar-dark.svg
          if git diff --cached --quiet; then
            echo "Calendar is up to date"
          else
            git commit -m "Update contribution calendar"
            git pull --rebase origin main
            git push
          fi
